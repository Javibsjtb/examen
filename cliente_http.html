<!doctype html><html lang="es"><meta charset="utf-8"><title>Cliente HTTP local - Serie 4</title>
<style>body{font:16px Arial;margin:32px;background:#f5f5f5;color:#202020}main{background:white;border:1px solid #bbb;padding:24px;max-width:1050px;margin:auto}h1{font-size:23px;margin-top:0}p{color:#555}select,input,button,textarea{font:16px monospace;padding:10px;border:1px solid #999}input{width:64%}button{cursor:pointer}textarea{display:block;width:96%;height:125px}pre{font:17px/1.45 monospace;white-space:pre-wrap;margin:0}h2{font-size:16px;margin:22px 0 8px}#estado{font-weight:bold;color:#135525}#respuesta{border:1px solid #bbb;background:#fafafa;padding:15px;min-height:245px}</style>
<main><h1>Cliente HTTP local - Pruebas de API</h1><p>Django REST Framework / MySQL · Recurso: animales</p>
<select id="metodo"><option>POST</option><option>GET</option><option>PUT</option><option>DELETE</option></select>
<input id="url" value="http://127.0.0.1:8001/api/animales/"><button id="enviar">Enviar</button>
<h2>Cuerpo enviado (JSON)</h2><textarea id="cuerpo"></textarea><p>Content-Type: application/json</p>
<h2>Respuesta</h2><p id="estado">Sin ejecutar</p><pre id="respuesta"></pre></main>
<script>document.querySelector('#enviar').onclick=async()=>{let method=document.querySelector('#metodo').value;let body=document.querySelector('#cuerpo').value;document.querySelector('#estado').textContent='Enviando...';try{let r=await fetch(document.querySelector('#url').value,{method,headers:{'Content-Type':'application/json'},...(['POST','PUT'].includes(method)?{body}: {})});let data=await r.json();document.querySelector('#estado').textContent=r.status+' '+r.statusText+' | '+r.headers.get('Content-Type');document.querySelector('#respuesta').textContent=JSON.stringify(data,null,2)}catch(e){document.querySelector('#estado').textContent='Error';document.querySelector('#respuesta').textContent=e.message}};</script></html>
